<style>

canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}

.tap-btn.alien{background:radial-gradient(circle,#39ff14,#00f5ff);border-color:rgba(57,255,20,0.6)}

class Particle{
constructor(x,y,color){
this.x=x;this.y=y;this.color=color;
this.vx=(Math.random()-0.5)*6;this.vy=(Math.random()-0.5)*6;
this.life=1;this.decay=0.015;this.size=Math.random()*4+2;
}
update(){
this.x+=this.vx;this.y+=this.vy;this.life-=this.decay;
this.vx*=0.98;this.vy*=0.98;
}
draw(){
ctx.globalAlpha=this.life;
ctx.fillStyle=this.color;
ctx.shadowBlur=15;
ctx.shadowColor=this.color;
ctx.beginPath();
ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
ctx.fill();
}
}
function initAudio(){
if(audioCtx)return;
try{
audioCtx=new(window.AudioContext||window.webkitAudioContext)();
musicGain=audioCtx.createGain();
musicGain.gain.value=state.music/100*0.3;
musicGain.connect(audioCtx.destination);
sfxGain=audioCtx.createGain();
sfxGain.gain.value=state.sfx/100;
sfxGain.connect(audioCtx.destination);
playMusic();
}catch(e){}
}
function playMusic(){
if(!audioCtx)return;
const notes=[220,261.63,329.63,392,440,523.25];
let i=0;
function play(){
if(!audioCtx||audioCtx.state==='closed')return;
const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();
osc.type='sine';
osc.frequency.value=notes[i%notes.length];
const now=audioCtx.currentTime;
gain.gain.setValueAtTime(0,now);
gain.gain.linearRampToValueAtTime(0.08,now+0.5);
gain.gain.linearRampToValueAtTime(0,now+4);
osc.connect(gain);gain.connect(musicGain);
osc.start(now);osc.stop(now+4);
i++;
setTimeout(play,3000);
}
play();
}
function playTap(){
if(!audioCtx||state.sfx===0)return;
const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();
const lfo=audioCtx.createOscillator();
const lfoGain=audioCtx.createGain();
osc.type='sine';
osc.frequency.value=500+Math.random()*200;
lfo.type='sine';
lfo.frequency.value=8;
lfoGain.gain.value=50;
lfo.connect(lfoGain);
lfoGain.connect(osc.frequency);
const now=audioCtx.currentTime;
gain.gain.setValueAtTime(0,now);
gain.gain.linearRampToValueAtTime(0.25,now+0.03);
gain.gain.exponentialRampToValueAtTime(0.001,now+0.2);
osc.connect(gain);gain.connect(sfxGain);
osc.start(now);lfo.start(now);
osc.stop(now+0.2);lfo.stop(now+0.2);
}
function playEvolve(){
if(!audioCtx||state.sfx===0)return;
const notes=[523.25,659.25,783.99,1046.50,1318.51];
notes.forEach((f,i)=>{
setTimeout(()=>{
const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();
osc.type='square';
osc.frequency.value=f;
const now=audioCtx.currentTime;
gain.gain.setValueAtTime(0,now);
gain.gain.linearRampToValueAtTime(0.15,now+0.05);
gain.gain.linearRampToValueAtTime(0,now+0.4);
osc.connect(gain);gain.connect(sfxGain);
osc.start(now);osc.stop(now+0.4);
},i*120);
});
}
function drawGrid(){
const color=COLORS[state.stage];
ctx.strokeStyle=color;
ctx.globalAlpha=0.08;
ctx.lineWidth=1;
const gridSize=50;
gridOffset=(gridOffset+0.3)%gridSize;
for(let x=-gridSize+gridOffset;x<canvas.width+gridSize;x+=gridSize){
ctx.beginPath();
ctx.moveTo(x,0);
ctx.lineTo(x,canvas.height);
ctx.stroke();
}
for(let y=-gridSize+gridOffset;y<canvas.height+gridSize;y+=gridSize){
ctx.beginPath();
ctx.moveTo(0,y);
ctx.lineTo(canvas.width,y);
ctx.stroke();
}
}

function tap(){
initAudio();
state.taps++;
playTap();
showAlien();
const cx=canvas.width/2;
const cy=canvas.height/2;
const color=COLORS[state.stage];
for(let i=0;i<15;i++){
particles.push(new Particle(cx,cy,color));
}
checkEvolution();
updateUI();
save();
}
function checkEvolution(){
const newStage=STAGES.findIndex(s=>state.taps<s)-1;
if(newStage>state.stage){
state.stage=newStage;
playEvolve();
showNotif(T[state.lang].achieved+' '+T[state.lang].stages[state.stage]);
if(!state.achievements.includes(state.stage)){
state.achievements.push(state.stage);
}
}
}
function updateUI(){
const t=T[state.lang];
document.getElementById('energy').textContent=formatNumber(state.taps);
document.getElementById('taps').textContent=formatNumber(state.taps);
document.getElementById('stage').textContent=state.stage+1;
document.getElementById('stageName').textContent=t.stages[state.stage];
document.getElementById('speech').textContent=t.speech[state.stage];
const next=STAGES[state.stage+1]||STAGES[state.stage]*2;
const prev=STAGES[state.stage];
const progress=((state.taps-prev)/(next-prev))*100;
document.getElementById('progress').style.width=Math.min(100,progress)+'%';
}
function formatNumber(n){
if(n>=1e18)return(n/1e18).toFixed(1)+'Qi';
if(n>=1e15)return(n/1e15).toFixed(1)+'Qa';
if(n>=1e12)return(n/1e12).toFixed(1)+'T';
if(n>=1e9)return(n/1e9).toFixed(1)+'B';
if(n>=1e6)return(n/1e6).toFixed(1)+'M';
if(n>=1e3)return(n/1e3).toFixed(1)+'K';
return n.toString();
}
function showNotif(msg){
const n=document.getElementById('notif');
n.textContent=msg;
n.classList.add('show');
setTimeout(()=>n.classList.remove('show'),2500);
}
function showAd(){
if(ysdk){
ysdk.adv.showRewardedVideo({
callbacks:{
onRewarded:()=>{
const bonus=100*(state.stage+1);
state.taps+=bonus;
checkEvolution();
updateUI();
save();
showNotif('+'+formatNumber(bonus)+' ⚡');
}
}
});
}else{
const bonus=100*(state.stage+1);
state.taps+=bonus;
checkEvolution();
updateUI();
save();
showNotif('+'+formatNumber(bonus)+' ⚡');
}
}
function showAchievements(){
const list=document.getElementById('achieveList');
list.innerHTML='';
const t=T[state.lang];
for(let i=0;i<30;i++){
const unlocked=state.achievements.includes(i);
const div=document.createElement('div');
div.style.cssText='padding:10px;margin:5px 0;background:rgba(255,255,255,0.05);border-radius:10px;opacity:'+(unlocked?1:0.3)+';text-align:left;display:flex;align-items:center;gap:10px';
div.innerHTML=(unlocked?'✅ ':'🔒 ')+'<span style="font-size:14px">'+t.stages[i]+'</span>';
list.appendChild(div);
}
document.getElementById('achieveModal').classList.add('show');
}
function shareAchievements(){
const t=T[state.lang];
const unlocked=state.achievements.length;
const text=`🌌 QUANTUM: AI Evolution\n🎯 ${t.stages[state.stage]}\n⚡ ${formatNumber(state.taps)} energy\n🏆 ${unlocked}/30 achievements\n\nPlay now!`;
if(navigator.share){
navigator.share({title:'QUANTUM',text:text}).then(()=>{
showNotif(t.shared);
}).catch(()=>{});
}else{
navigator.clipboard.writeText(text).then(()=>{
showNotif(t.shared);
});
}
}

function openSettings(){document.getElementById('settingsModal').classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function setMusic(v){state.music=parseInt(v);if(musicGain)musicGain.gain.value=v/100*0.3;save()}
function setSfx(v){state.sfx=parseInt(v);if(sfxGain)sfxGain.gain.value=v/100;save()}
function setLang(l){state.lang=l;updateUI();save()}
function save(){
if(player){
player.setData(state);
}else{
localStorage.setItem('quantumSave',JSON.stringify(state));
}
}
function animate(){
ctx.fillStyle='rgba(0,0,0,0.15)';
ctx.fillRect(0,0,canvas.width,canvas.height);
drawGrid();
particles=particles.filter(p=>p.life>0);
particles.forEach(p=>{p.update();p.draw()});
const cx=canvas.width/2;
const cy=canvas.height/2;
const color=COLORS[state.stage];
const baseSize=40+state.stage*3;
ctx.globalAlpha=0.9;
ctx.fillStyle=color;
ctx.shadowBlur=40;
ctx.shadowColor=color;
ctx.beginPath();
ctx.arc(cx,cy,baseSize,0,Math.PI*2);
ctx.fill();
ctx.globalAlpha=0.4;
ctx.fillStyle=color;
ctx.shadowBlur=60;
ctx.beginPath();
ctx.arc(cx,cy,baseSize*1.5,0,Math.PI*2);
ctx.fill();
ctx.globalAlpha=0.2;
ctx.fillStyle=color;
ctx.shadowBlur=80;
ctx.beginPath();
ctx.arc(cx,cy,baseSize*2,0,Math.PI*2);
ctx.fill();
requestAnimationFrame(animate);
}
animate();
