<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>QUANTUM</title>
<script src="https://yandex.ru/games/sdk/v2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#000;color:#fff;user-select:none;-webkit-user-select:none}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
.ui{position:fixed;z-index:10;pointer-events:none}
.ui>*{pointer-events:auto}
.top{top:0;left:0;right:0;padding:8px;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);display:flex;justify-content:space-between;align-items:center;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.1)}
.stat{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,0.05);padding:4px 8px;border-radius:8px}
.stage{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.stage-name{font-size:24px;font-weight:900;background:linear-gradient(90deg,#00f5ff,#b026ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;text-shadow:0 0 30px rgba(0,245,255,0.5)}
.speech{font-size:14px;opacity:0.9;max-width:300px;margin:0 auto;padding:10px;background:rgba(0,0,0,0.5);border-radius:12px;border:1px solid rgba(255,255,255,0.2);backdrop-filter:blur(10px);min-height:40px}
.bottom{bottom:0;left:0;right:0;padding:15px;display:flex;flex-direction:column;align-items:center;gap:10px}
.tap-btn{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#00f5ff,#b026ff);border:3px solid rgba(255,255,255,0.3);color:#fff;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 0 50px rgba(0,245,255,0.6),inset 0 0 30px rgba(255,255,255,0.2);transition:transform 0.1s;animation:pulse 2s ease-in-out infinite}
.tap-btn:active{transform:scale(0.9);animation:none}
@keyframes pulse{0%,100%{box-shadow:0 0 50px rgba(0,245,255,0.6)}50%{box-shadow:0 0 80px rgba(176,38,255,0.8)}}
.progress{width:100%;max-width:400px;height:8px;background:rgba(255,255,255,0.1);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#00f5ff,#b026ff);transition:width 0.3s;box-shadow:0 0 10px #00f5ff}
.actions{display:flex;gap:8px}
.action-btn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;padding:8px 16px;border-radius:10px;font-size:12px;cursor:pointer;backdrop-filter:blur(10px);transition:all 0.2s}
.action-btn:hover{background:rgba(255,255,255,0.2);transform:translateY(-2px)}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.show{display:flex}
.modal-content{background:linear-gradient(135deg,#0f0c29,#302b63);border:2px solid rgba(255,255,255,0.2);padding:30px;border-radius:20px;max-width:400px;width:100%;text-align:center;box-shadow:0 0 60px rgba(0,245,255,0.3)}
.modal-content h2{background:linear-gradient(90deg,#00f5ff,#b026ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:15px;font-size:24px}
.modal-content p{margin-bottom:20px;line-height:1.6;opacity:0.9}
.modal-btn{background:linear-gradient(135deg,#00f5ff,#b026ff);color:#fff;border:none;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;margin:5px;transition:all 0.3s;box-shadow:0 0 20px rgba(0,245,255,0.4)}
.modal-btn:hover{transform:translateY(-2px);box-shadow:0 0 30px rgba(0,245,255,0.6)}
.notification{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);border:1px solid rgba(0,245,255,0.5);padding:12px 24px;border-radius:15px;opacity:0;transition:all 0.3s;pointer-events:none;z-index:200;font-size:13px;backdrop-filter:blur(10px);box-shadow:0 0 30px rgba(0,245,255,0.4)}
.notification.show{opacity:1;top:90px}
.settings-btn{position:fixed;top:8px;right:8px;width:36px;height:36px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:50%;color:#fff;font-size:18px;cursor:pointer;z-index:50;backdrop-filter:blur(10px);transition:all 0.3s}
.settings-btn:hover{transform:rotate(180deg);background:rgba(255,255,255,0.2)}
@media(min-width:768px){.tap-btn{width:150px;height:150px;font-size:20px}.stage-name{font-size:32px}.speech{font-size:16px;max-width:500px}}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<button class="settings-btn" onclick="openSettings()">⚙️</button>
<div class="ui top">
<div class="stat">⚡<span id="energy">0</span></div>
<div class="stat">🌟<span id="taps">0</span></div>
<div class="stat">🎯<span id="stage">1</span>/10</div>
</div>
<div class="ui stage">
<div class="stage-name" id="stageName">Quantum Spark</div>
<div class="speech" id="speech">Tap to create energy...</div>
</div>
<div class="ui bottom">
<div class="progress"><div class="progress-fill" id="progress" style="width:0%"></div></div>
<button class="tap-btn" onclick="tap()">TAP</button>
<div class="actions">
<button class="action-btn" onclick="showAd()">📺 Ad x2</button>
<button class="action-btn" onclick="showAchievements()">🏆</button>
</div>
</div>
<div class="modal" id="achieveModal">
<div class="modal-content">
<h2>🏆 Achievements</h2>
<div id="achieveList"></div>
<button class="modal-btn" onclick="closeModal('achieveModal')">Close</button>
</div>
</div>
<div class="modal" id="settingsModal">
<div class="modal-content">
<h2>⚙️ Settings</h2>
<div style="margin:15px 0">
<label>🔊 Music</label>
<input type="range" id="musicVol" min="0" max="100" value="30" oninput="setMusic(this.value)" style="width:100%">
</div>
<div style="margin:15px 0">
<label>🎵 SFX</label>
<input type="range" id="sfxVol" min="0" max="100" value="70" oninput="setSfx(this.value)" style="width:100%">
</div>
<div style="margin:15px 0">
<label>🌍 Language</label>
<select id="langSelect" onchange="setLang(this.value)" style="padding:8px;border-radius:8px;background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2)">
<option value="en">English</option>
<option value="ru">Русский</option>
<option value="es">Español</option>
<option value="tr">Türkçe</option>
<option value="pt">Português</option>
<option value="kk">Қазақша</option>
</select>
</div>
<button class="modal-btn" onclick="closeModal('settingsModal')">Close</button>
</div>
</div>
<div class="notification" id="notif"></div>
<script>
const T={
en:{stages:["Quantum Spark","Photon","Electron","Atom","Molecule","Cell","Being","Mind","Civilization","Universe"],speech:["Tap to create energy...","I am light...","I have charge...","I am building...","I am complex...","I am alive...","I think...","We are many...","We build...","We are everything..."],tap:"TAP",ad:"📺 Ad x2",achieve:"🏆",close:"Close",settings:"Settings",music:"Music",sfx:"SFX",language:"Language",achieved:"Achievement unlocked!"},
ru:{stages:["Квантовая искра","Фотон","Электрон","Атом","Молекула","Клетка","Существо","Разум","Цивилизация","Вселенная"],speech:["Тапай чтобы создать энергию...","Я — свет...","У меня есть заряд...","Я строюсь...","Я сложный...","Я живой...","Я мыслю...","Нас много...","Мы строим...","Мы — всё..."],tap:"ТАП",ad:"📺 Рек x2",achieve:"🏆",close:"Закрыть",settings:"Настройки",music:"Музыка",sfx:"Звуки",language:"Язык",achieved:"Достижение открыто!"},
es:{stages:["Chispa Cuántica","Fotón","Electrón","Átomo","Molécula","Célula","Ser","Mente","Civilización","Universo"],speech:["Toca para crear energía...","Soy luz...","Tengo carga...","Estoy construyendo...","Soy complejo...","Estoy vivo...","Pienso...","Somos muchos...","Construimos...","Somos todo..."],tap:"TOCA",ad:"📺 Anu x2",achieve:"🏆",close:"Cerrar",settings:"Ajustes",music:"Música",sfx:"Sonidos",language:"Idioma",achieved:"¡Logro desbloqueado!"},
tr:{stages:["Kuantum Kıvılcım","Foton","Elektron","Atom","Molekül","Hücre","Varlık","Zihin","Medeniyet","Evren"],speech:["Enerji yaratmak için dokun...","Ben ışığım...","Yüküm var...","İnşa ediyorum...","Karmaşığım...","Canlıyım...","Düşünüyorum...","Çoğuz...","İnşa ediyoruz...","Her şeyiz..."],tap:"DOKUN",ad:"📺 Rek x2",achieve:"🏆",close:"Kapat",settings:"Ayarlar",music:"Müzik",sfx:"Sesler",language:"Dil",achieved:"Başarım açıldı!"},
pt:{stages:["Faísca Quântica","Fóton","Elétron","Átomo","Molécula","Célula","Ser","Mente","Civilização","Universo"],speech:["Toque para criar energia...","Sou luz...","Tenho carga...","Estou construindo...","Sou complexo...","Estou vivo...","Eu penso...","Somos muitos...","Construímos...","Somos tudo..."],tap:"TOQUE",ad:"📺 Anú x2",achieve:"🏆",close:"Fechar",settings:"Config",music:"Música",sfx:"Sons",language:"Idioma",achieved:"Conquista desbloqueada!"},
kk:{stages:["Кванттық ұшқын","Фотон","Электрон","Атом","Молекула","Жасуша","Тіршілік","Ақыл","Өркениет","Ғалам"],speech:["Энергия yaratү үшін bas...","Men jarıqpın...","Menimde zarjad bar...","Men qurıp jatırmın...","Men kúrdelmın...","Men tırmın...","Men oylaymın...","Biz köppız...","Biz quramyz...","Biz barmyz..."],tap:"BAS",ad:"📺 Jar x2",achieve:"🏆",close:"Jabü",settings:"Baptar",music:"Muzika",sfx:"Dıbıstar",language:"Tıl",achieved:"Jetistik ashıldı!"}
};
const STAGES=[0,10,50,200,1000,5000,20000,100000,500000,2000000];
const COLORS=["#00f5ff","#00ff88","#ffea00","#ff6b00","#ff006e","#b026ff","#39ff14","#00d4ff","#ff00aa","#ffffff"];
let state={taps:0,stage:0,lang:'en',music:30,sfx:70,achievements:[]};
let ysdk=null,player=null,audioCtx=null,musicGain=null,sfxGain=null;
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let particles=[];
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
window.addEventListener('resize',resize);
resize();
class Particle{
constructor(x,y,color){
this.x=x;this.y=y;this.color=color;
this.vx=(Math.random()-0.5)*4;this.vy=(Math.random()-0.5)*4;
this.life=1;this.decay=0.02;this.size=Math.random()*3+2;
}
update(){
this.x+=this.vx;this.y+=this.vy;this.life-=this.decay;
}
draw(){
ctx.globalAlpha=this.life;
ctx.fillStyle=this.color;
ctx.beginPath();
ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
ctx.fill();
}
}
function initAudio(){
if(audioCtx)return;
try{
audioCtx=new(window.AudioContext||window.webkitAudioContext)();
musicGain=audioCtx.createGain();
musicGain.gain.value=state.music/100*0.3;
musicGain.connect(audioCtx.destination);
sfxGain=audioCtx.createGain();
sfxGain.gain.value=state.sfx/100;
sfxGain.connect(audioCtx.destination);
playMusic();
}catch(e){}
}
function playMusic(){
if(!audioCtx)return;
const notes=[220,261.63,329.63,392,440];
let i=0;
function play(){
if(!audioCtx||audioCtx.state==='closed')return;
const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();
osc.type='sine';
osc.frequency.value=notes[i%notes.length];
const now=audioCtx.currentTime;
gain.gain.setValueAtTime(0,now);
gain.gain.linearRampToValueAtTime(0.1,now+0.5);
gain.gain.linearRampToValueAtTime(0,now+3);
osc.connect(gain);gain.connect(musicGain);
osc.start(now);osc.stop(now+3);
i++;
setTimeout(play,2500);
}
play();
}
function playTap(){
if(!audioCtx||state.sfx===0)return;
const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();
osc.type='sine';
osc.frequency.value=800+Math.random()*400;
const now=audioCtx.currentTime;
gain.gain.setValueAtTime(0,now);
gain.gain.linearRampToValueAtTime(0.3,now+0.02);
gain.gain.linearRampToValueAtTime(0,now+0.1);
osc.connect(gain);gain.connect(sfxGain);
osc.start(now);osc.stop(now+0.1);
}
function playEvolve(){
if(!audioCtx||state.sfx===0)return;
const notes=[523.25,659.25,783.99,1046.50];
notes.forEach((f,i)=>{
setTimeout(()=>{
const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();
osc.type='square';
osc.frequency.value=f;
const now=audioCtx.currentTime;
gain.gain.setValueAtTime(0,now);
gain.gain.linearRampToValueAtTime(0.2,now+0.05);
gain.gain.linearRampToValueAtTime(0,now+0.3);
osc.connect(gain);gain.connect(sfxGain);
osc.start(now);osc.stop(now+0.3);
},i*100);
});
}
function tap(){
initAudio();
state.taps++;
playTap();
const cx=canvas.width/2;
const cy=canvas.height/2;
const color=COLORS[state.stage];
for(let i=0;i<10;i++){
particles.push(new Particle(cx,cy,color));
}
checkEvolution();
updateUI();
save();
}
function checkEvolution(){
const newStage=STAGES.findIndex(s=>state.taps<s)-1;
if(newStage>state.stage){
state.stage=newStage;
playEvolve();
showNotif(T[state.lang].achieved+' '+T[state.lang].stages[state.stage]);
if(!state.achievements.includes(state.stage)){
state.achievements.push(state.stage);
}
}
}
function updateUI(){
const t=T[state.lang];
document.getElementById('energy').textContent=state.taps;
document.getElementById('taps').textContent=state.taps;
document.getElementById('stage').textContent=state.stage+1;
document.getElementById('stageName').textContent=t.stages[state.stage];
document.getElementById('speech').textContent=t.speech[state.stage];
const next=STAGES[state.stage+1]||STAGES[state.stage]*2;
const prev=STAGES[state.stage];
const progress=((state.taps-prev)/(next-prev))*100;
document.getElementById('progress').style.width=Math.min(100,progress)+'%';
document.body.style.background=`radial-gradient(circle at center, ${COLORS[state.stage]}22, #000)`;
}
function showNotif(msg){
const n=document.getElementById('notif');
n.textContent=msg;
n.classList.add('show');
setTimeout(()=>n.classList.remove('show'),2500);
}
function showAd(){
if(ysdk){
ysdk.adv.showRewardedVideo({
callbacks:{
onRewarded:()=>{
state.taps+=100*(state.stage+1);
checkEvolution();
updateUI();
save();
showNotif('+'+(100*(state.stage+1))+' ⚡');
}
}
});
}else{
state.taps+=100*(state.stage+1);
checkEvolution();
updateUI();
save();
showNotif('+'+(100*(state.stage+1))+' ⚡');
}
}
function showAchievements(){
const list=document.getElementById('achieveList');
list.innerHTML='';
const t=T[state.lang];
for(let i=0;i<10;i++){
const unlocked=state.achievements.includes(i);
const div=document.createElement('div');
div.style.cssText='padding:10px;margin:5px 0;background:rgba(255,255,255,0.05);border-radius:10px;opacity:'+(unlocked?1:0.3);
div.textContent=(unlocked?'✅ ':'🔒 ')+t.stages[i];
list.appendChild(div);
}
document.getElementById('achieveModal').classList.add('show');
}
function openSettings(){document.getElementById('settingsModal').classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function setMusic(v){state.music=parseInt(v);if(musicGain)musicGain.gain.value=v/100*0.3;save()}
function setSfx(v){state.sfx=parseInt(v);if(sfxGain)sfxGain.gain.value=v/100;save()}
function setLang(l){state.lang=l;updateUI();save()}
function save(){
if(player){
player.setData(state);
}else{
localStorage.setItem('quantumSave',JSON.stringify(state));
}
}
function animate(){
ctx.fillStyle='rgba(0,0,0,0.1)';
ctx.fillRect(0,0,canvas.width,canvas.height);
particles=particles.filter(p=>p.life>0);
particles.forEach(p=>{p.update();p.draw()});
const cx=canvas.width/2;
const cy=canvas.height/2;
const color=COLORS[state.stage];
const size=20+state.stage*5;
ctx.globalAlpha=0.8;
ctx.fillStyle=color;
ctx.beginPath();
ctx.arc(cx,cy,size,0,Math.PI*2);
ctx.fill();
ctx.globalAlpha=0.3;
ctx.fillStyle=color;
ctx.beginPath();
ctx.arc(cx,cy,size*1.5,0,Math.PI*2);
ctx.fill();
requestAnimationFrame(animate);
}
animate();
YaGames.init().then(s=>{
ysdk=s;
const lang=ysdk.environment.i18n.lang;
if(T[lang])state.lang=lang;
document.getElementById('langSelect').value=state.lang;
ysdk.getPlayer().then(p=>{
player=p;
p.getData().then(d=>{
if(d.taps!==undefined){
state={...state,...d};
document.getElementById('musicVol').value=state.music;
document.getElementById('sfxVol').value=state.sfx;
document.getElementById('langSelect').value=state.lang;
}
updateUI();
});
}).catch(()=>{
const saved=localStorage.getItem('quantumSave');
if(saved){
state={...state,...JSON.parse(saved)};
document.getElementById('musicVol').value=state.music;
document.getElementById('sfxVol').value=state.sfx;
document.getElementById('langSelect').value=state.lang;
}
updateUI();
});
}).catch(()=>{
const saved=localStorage.getItem('quantumSave');
if(saved){
state={...state,...JSON.parse(saved)};
document.getElementById('musicVol').value=state.music;
document.getElementById('sfxVol').value=state.sfx;
document.getElementById('langSelect').value=state.lang;
}
updateUI();
});
document.body.addEventListener('click',initAudio,{once:true});
document.body.addEventListener('touchstart',initAudio,{once:true});
window.addEventListener('blur',()=>{if(state.taps>0)save()});
window.addEventListener('beforeunload',()=>{if(state.taps>0)save()});
</script>
</body>
</html>
